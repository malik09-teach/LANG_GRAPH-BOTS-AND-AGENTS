<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Symbolic Formulation Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Agentic Formulation</h1>
            </div>
            <p>Neuro-Symbolic Bayesian Optimization</p>
        </header>

        <main>
            <section class="control-panel glass-panel">
                <h2>Experiment Configuration</h2>
                <div class="input-group">
                    <label for="iterations">Number of Iterations</label>
                    <input type="number" id="iterations" value="5" min="1" max="20">
                </div>
                <button id="run-btn" class="primary-btn">
                    <span class="btn-text">Run Optimization</span>
                    <div class="loader hidden"></div>
                </button>
            </section>

            <section class="results-panel glass-panel">
                <div class="results-header">
                    <h2>Optimization Results</h2>
                    <div class="status-badge" id="status-badge">Idle</div>
                </div>
                
                <div class="metrics-grid hidden" id="metrics-grid">
                    <div class="metric-card">
                        <h3>Best Stability Score</h3>
                        <div class="metric-value" id="best-score">--</div>
                    </div>
                    <div class="metric-card">
                        <h3>Best Formulation</h3>
                        <div class="metric-value small-text" id="best-formulation">--</div>
                    </div>
                    <div class="metric-card">
                        <h3>Iterations</h3>
                        <div class="metric-value" id="total-iterations">--</div>
                    </div>
                </div>

                <div class="history-container hidden" id="history-container">
                    <h3>Experiment History</h3>
                    <div class="history-list" id="history-list">
                        <!-- History items will be injected here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
